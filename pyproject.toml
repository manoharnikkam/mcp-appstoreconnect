[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-appstoreconnect"
version = "0.1.0"
description = "MCP server for Apple App Store Connect API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "app-store-connect", "apple", "ios", "macos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "PyJWT[crypto]>=2.8.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
mcp-appstoreconnect = "mcp_appstoreconnect.server:main"

[project.urls]
Homepage = "https://github.com/manoharnikkam/mcp-appstoreconnect"
Repository = "https://github.com/manoharnikkam/mcp-appstoreconnect"
Issues = "https://github.com/manoharnikkam/mcp-appstoreconnect/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_appstoreconnect"]
